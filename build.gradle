buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
    }
}
plugins {
    id 'eclipse'
    id 'maven-publish'
}
apply plugin: 'net.minecraftforge.gradle'

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: 'official', version: '1.19.2'

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                howtofish {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                howtofish {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mod', 'howtofish', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                howtofish {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.19.2-43.4.0'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, forge_version: forge_version,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
            mod_version: mod_version, mod_authors: mod_authors, mod_description: mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

// ---- Atria Dawn Chat: build the standalone mod's jar inside this build ----
// The sources live in atriadawn-mod/ as an independent mod (own mod id
// "atriadawn"), but they are compiled and packaged here too, so the root CI
// artifact (build/libs/*.jar) ships both jars. This block skips itself when
// the folder is moved to its own repository.
def atriaDir = file('atriadawn-mod')
if (atriaDir.isDirectory()) {
    def atriaProps = new Properties()
    new File(atriaDir, 'gradle.properties').withInputStream { atriaProps.load(it) }

    sourceSets {
        atriadawn {
            java.srcDir new File(atriaDir, 'src/main/java')
            resources.srcDir new File(atriaDir, 'src/main/resources')
        }
    }
    // The atriadawn code uses the same Minecraft/Forge APIs as the main mod.
    sourceSets.atriadawn.compileClasspath += sourceSets.main.compileClasspath

    def atriaReplace = [
            minecraft_version: minecraft_version,
            forge_version    : forge_version,
            mod_id           : atriaProps.getProperty('mod_id'),
            mod_name         : atriaProps.getProperty('mod_name'),
            mod_license      : atriaProps.getProperty('mod_license'),
            mod_version      : atriaProps.getProperty('mod_version'),
            mod_authors      : atriaProps.getProperty('mod_authors'),
            mod_description  : atriaProps.getProperty('mod_description')
    ]

    tasks.register('atriadawnJar', Jar) {
        archiveBaseName = atriaProps.getProperty('mod_id')
        archiveVersion = atriaProps.getProperty('mod_version')
        from sourceSets.atriadawn.output
        manifest {
            attributes([
                    'Specification-Title'   : atriaProps.getProperty('mod_id'),
                    'Specification-Vendor'  : atriaProps.getProperty('mod_authors'),
                    'Specification-Version' : '1',
                    'Implementation-Title'  : atriaProps.getProperty('mod_name'),
                    'Implementation-Version': atriaProps.getProperty('mod_version'),
                    'Implementation-Vendor' : atriaProps.getProperty('mod_authors')
            ])
        }
    }

    // Expand ${mod_id} etc. in the atriadawn mods.toml.
    tasks.named('processAtriadawnResources', Copy).configure {
        inputs.properties atriaReplace
        filesMatching('META-INF/mods.toml') {
            expand atriaReplace
        }
    }

    // ForgeGradle 5: register a reobfAtriadawnJar task (SRG remap for release),
    // same as reobfJar for the main jar; assemble depends on it automatically.
    reobf {
        create('atriadawnJar')
    }
}

// ---- CI diagnostics: after every build, sweep the repo for any produced
// atriadawn jar and pack it (plus a full state report) into build/libs as a
// tiny zip named *.jar, so the CI artifact always carries the evidence.
def atriaDiagDir = file('atriadawn-mod')
gradle.buildFinished {
    if (!atriaDiagDir.isDirectory()) {
        return
    }
    def rootLibs = new File(buildDir, 'libs')
    rootLibs.mkdirs()
    def sweep = []
    atriaDiagDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
        if (f.name.startsWith('atriadawn') && f.name.endsWith('.jar') && f.length() > 0
                && !f.parentFile.equals(rootLibs)) {
            sweep << f
        }
    }
    sweep.each { f ->
        def target = new File(rootLibs, f.name)
        java.nio.file.Files.copy(f.toPath(), target.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
    def sb = new StringBuilder()
    sb << "buildDir: ${buildDir.absolutePath}\n"
    sb << "sourceSets: ${project.sourceSets.names}\n"
    sb << "atriadawn tasks: ${project.tasks.names.findAll { it.toLowerCase().contains('atriadawn') }.sort()}\n"
    sb << "reobf tasks: ${project.tasks.names.findAll { it.startsWith('reobf') }.sort()}\n"
    sb << "build/libs: ${rootLibs.listFiles()?.collect { it.name + ' ' + it.length() }?.sort()}\n"
    sb << "sweep: ${sweep.collect { it.absolutePath + ' ' + it.length() }}\n"
    def subBuild = new File(atriaDiagDir, 'build')
    if (subBuild.isDirectory()) {
        subBuild.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            sb << "sub: ${f.absolutePath.replace(atriaDiagDir.absolutePath, '')} ${f.length()}\n"
        }
    } else {
        sb << "sub build dir: absent\n"
    }
    def canary = new File(rootLibs, 'atriadawn-canary.jar')
    def zos = new java.util.zip.ZipOutputStream(new FileOutputStream(canary))
    zos.putNextEntry(new java.util.zip.ZipEntry('canary.txt'))
    zos.write(sb.toString().getBytes('UTF-8'))
    zos.closeEntry()
    sweep.each { f ->
        zos.putNextEntry(new java.util.zip.ZipEntry('found/' + f.name))
        zos.write(f.bytes)
        zos.closeEntry()
    }
    zos.close()
    println "atriadawn CANARY: ${sb.toString().replace('\n', ' | ')}"
}
