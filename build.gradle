buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
    }
}
plugins {
    id 'eclipse'
    id 'maven-publish'
}
apply plugin: 'net.minecraftforge.gradle'

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: 'official', version: '1.19.2'

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                howtofish {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                howtofish {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mod', 'howtofish', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                howtofish {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.19.2-43.4.0'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, forge_version: forge_version,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
            mod_version: mod_version, mod_authors: mod_authors, mod_description: mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

// Build the standalone Atria Dawn mod (atriadawn-mod/) together with the root
// project. Its build.gradle detects the monorepo and writes the jar straight
// into <root>/build/libs, so the CI artifact (build/libs/*.jar) ships both
// mods. The task skips itself when the folder moves to its own repository.
def atriadawnDir = file('atriadawn-mod')
tasks.register('buildAtriadawnMod', Exec) {
    onlyIf { atriadawnDir.isDirectory() }
    workingDir = atriadawnDir
    // Absolute wrapper path + explicit -p: never depend on cwd resolution.
    commandLine new File(atriadawnDir, 'gradlew').absolutePath,
            '-p', atriadawnDir.absolutePath,
            'build', '--no-daemon', '--stacktrace'
    doFirst {
        buildDir.mkdirs()
        standardOutput = new FileOutputStream(new File(buildDir, 'atriadawn-build.log'))
        errorOutput = standardOutput
    }
    doLast {
        // Fallback copy in case the subproject jar did not land in build/libs.
        def subLibs = new File(atriadawnDir, 'build/libs')
        if (subLibs.isDirectory()) {
            copy {
                from subLibs
                include 'atriadawn-*.jar'
                into new File(buildDir, 'libs')
            }
        }
        def rootLibs = new File(buildDir, 'libs')
        println "atriadawn: subproject build/libs = ${subLibs.isDirectory() ? subLibs.listFiles().collect { it.name + '(' + it.length() + ')' } : 'missing'}"
        def found = fileTree(rootLibs).matching { include 'atriadawn-*.jar' }
        println "atriadawn: root build/libs atriadawn jars = ${found.isEmpty() ? 'NONE' : found.files.collect { it.name + '(' + it.length() + ')' }}"
        def log = new File(buildDir, 'atriadawn-build.log')
        if (log.isFile()) {
            def lines = log.readLines()
            println "atriadawn build log tail (${lines.size()} lines):"
            lines.takeRight(25).each { println "atriadawn> ${it}" }
        }
    }
}
tasks.named('build') {
    dependsOn 'buildAtriadawnMod'
}
